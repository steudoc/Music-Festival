{% extends "base.html" %}

{% block title %}Registrati{% endblock %}

{% block content %}
<div class="col-12 d-flex justify-content-center align-items-center min-vh-100 mt-4">
    <form class="form-insert form-signup col-11 col-md-6 col-lg-4 p-4 rounded shadow" id="form-signup"
          method="POST" action="{{ url_for('register_user') }}" enctype="multipart/form-data">
        
        <div class="text-center mb-4">
            <img src="/static/images/logo.PNG" alt="logo" height="57" class="mb-2">
            <h1 class="h4 fw-bold">Crea il tuo account</h1>
            <p class="small text-light">Inserisci i tuoi dati per registrarti</p>
        </div>

        <div class="form-group mb-3">
            <label for="email" class="form-label">Email</label> 
            <input type="email" class="form-control bg-dark text-white border-0" id="email" placeholder="email@example.com" name="email" required>
        </div>

        <div class="form-group mb-3">
            <label for="password" class="form-label">Password</label> 
            <input type="password" class="form-control bg-dark text-white border-0" id="password"
                   placeholder="Password" name="password" required>
        </div>

        <div class="form-group mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control bg-dark text-white border-0" id="nome"
                   placeholder="Nome" name="nome" required>
        </div>

        <div class="form-group mb-3">
            <label for="cognome" class="form-label">Cognome</label>
            <input type="text" class="form-control bg-dark text-white border-0" id="cognome"
                   placeholder="Cognome" name="cognome" required>
        </div>

        <div class="form-group mb-3">
            <label for="sesso" class="form-label">Sesso</label>
            <select class="form-select bg-dark text-white border-0" id="sesso" name="sesso" required>
                <option value="" selected disabled>Seleziona sesso</option>
                <option value="M">Maschio</option>
                <option value="F">Femmina</option>
                <option value="N">Altro/preferisco non indicarlo</option>
            </select>
        </div>

        <div class="form-group mb-2">
            <label for="organizzatore" class="form-label">Tipologia account</label>
            <select class="form-select bg-dark text-white border-0" id="organizzatore" name="organizzatore" required>
                <option value="" selected disabled>Seleziona il tipo di account</option>
                <option value="0">Partecipante</option>
                <option value="1">Organizzatore</option>
            </select>
        </div>

        <div class="col-12 mb-3">
            <small>Hai già un account? <a href="#loginModal" data-bs-toggle="modal">Accedi</a></small>
        </div>

        <div class="form-footer d-flex justify-content-between">
            <button type="reset" class="btn-outline">Cancella</button>
            <button type="submit" class="btn ">Registrati</button>
        </div>
    </form>
</div>
{% endblock %}
